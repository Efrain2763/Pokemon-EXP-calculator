<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101827">
    <meta name="description" content="A mobile-friendly Pokémon EXP candy calculator.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <title>Pokémon Candy Calculator</title>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div>
          <p class="eyebrow">POKÉMON TRAINER TOOL</p>
          <h1>EXP candy calculator</h1>
          <p class="subtitle">Plan the levels. Let the candies do the work.</p>
        </div>
        <button class="add-button" id="add-pokemon" type="button" aria-label="Add Pokémon">
          <span aria-hidden="true">＋</span>
          <span class="button-label">Add Pokémon</span>
        </button>
      </header>

      <p class="status" id="status" role="status" aria-live="polite">Loading Pokémon…</p>
      <section class="cards" id="cards" aria-label="Pokémon cards"></section>
      <footer>Changes are saved automatically on this device.</footer>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
